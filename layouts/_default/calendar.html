{{ define "main" }}
<style>
.cal-page { padding:110px 0 60px; }
.cal-title { text-align:center; margin-bottom:28px; }
.cal-title h1 { font-family:var(--font-head); font-size:2rem; font-weight:800; color:var(--text); margin-bottom:6px; }
.cal-title h1 span { color:var(--accent); }
.cal-title p { color:var(--text-muted); font-size:.9rem; }

.cal-embed-wrap { background:var(--bg-surface); border-radius:16px; border:1px solid var(--border); overflow:hidden; }
.cal-embed-wrap iframe { display:block; width:100%; height:750px; border:none; }

.cal-footer { display:flex; justify-content:center; margin-top:16px; }
.cal-footer a { color:var(--text-muted); font-size:.85rem; text-decoration:underline; }

.comp-section { margin-top:56px; }
.comp-head { text-align:center; margin-bottom:24px; }
.comp-head h2 { font-family:var(--font-head); font-size:1.5rem; font-weight:800; color:var(--text); margin-bottom:6px; }
.comp-head p { color:var(--text-muted); font-size:.85rem; }
.comp-head p a { color:var(--accent); }

.comp-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
.comp-card { background:var(--bg-surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
.comp-card-date { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); margin-bottom:6px; }
.comp-card-title { font-size:.95rem; font-weight:700; color:var(--text); margin-bottom:8px; line-height:1.3; }
.comp-card-meta { font-size:.8rem; color:var(--text-muted); margin-bottom:4px; }
.comp-card-link { margin-top:10px; }
.comp-card-link a { color:var(--accent); font-size:.78rem; text-decoration:none; }
.comp-card-link a:hover { text-decoration:underline; }
.comp-status { text-align:center; padding:24px; color:var(--text-dim); font-size:.85rem; }

@media(max-width:640px) {
  .cal-page { padding:88px 0 40px; }
  .cal-embed-wrap iframe { height:600px; }
}
</style>

<div class="cal-page container">
  <div class="cal-title">
    <h1>Calendrier <span>du Club</span></h1>
    <p>Cours du Judo Club Cattenom · Rodemack</p>
  </div>

  <div class="cal-embed-wrap">
    <iframe src="https://judo-cattenom.fr/nextcloud/apps/calendar/p/_w9wl9-YJYcTn6YnT7DvCg" loading="lazy" title="Calendrier des cours"></iframe>
  </div>
  <div class="cal-footer">
    <a href="https://judo-cattenom.fr/nextcloud/apps/calendar/p/_w9wl9-YJYcTn6YnT7DvCg" target="_blank" rel="noopener">Ouvrir le calendrier en plein écran ↗</a>
  </div>

  <div class="comp-section">
    <div class="comp-head">
      <h2>Compétitions</h2>
      <p>Source : <a href="https://www.judo-moselle.fr/evenement" target="_blank" rel="noopener">judo-moselle.fr</a> (Ligue Grand Est / Comité de la Moselle)</p>
    </div>
    <div id="comp-grid" class="comp-grid">
      <div class="comp-status">Chargement…</div>
    </div>
  </div>
</div>

<script>
(function(){
var SUPABASE_URL = 'https://ajbpzueanpeukozjhkiv.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqYnB6dWVhbnBldWtvempoa2l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4OTQyMTAsImV4cCI6MjA4ODQ3MDIxMH0.1i1nJ3DlHGVPIWKNjD64ZyHj3cxG4o-ikju-sO0T67A';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtDate(iso){
  var d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });
}

function renderCard(c){
  var lieu = [c.lieu_nom, c.lieu_ville].filter(Boolean).join(', ');
  return '<div class="comp-card">' +
    '<div class="comp-card-date">' + fmtDate(c.date) + '</div>' +
    '<div class="comp-card-title">' + esc(c.title) + '</div>' +
    (lieu ? '<div class="comp-card-meta">📍 ' + esc(lieu) + '</div>' : '') +
    (c.niveau ? '<div class="comp-card-meta">🥋 ' + esc(c.niveau) + '</div>' : '') +
    (c.url_source ? '<div class="comp-card-link"><a href="' + esc(c.url_source) + '" target="_blank" rel="noopener">Détails ↗</a></div>' : '') +
    '</div>';
}

var today = new Date().toISOString().slice(0,10);
var url = SUPABASE_URL + '/rest/v1/competitions'
  + '?select=title,date,lieu_nom,lieu_ville,niveau,url_source'
  + '&date=gte.' + today
  + '&order=date.asc&limit=24';

fetch(url, {
  headers: {
    apikey: SUPABASE_ANON_KEY,
    Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
  }
})
  .then(function(r){ return r.json(); })
  .then(function(rows){
    var grid = document.getElementById('comp-grid');
    if (!Array.isArray(rows) || rows.length === 0) {
      grid.innerHTML = '<div class="comp-status">Aucune compétition à venir.</div>';
      return;
    }
    grid.innerHTML = rows.map(renderCard).join('');
  })
  .catch(function(e){
    console.error('Compétitions:', e);
    document.getElementById('comp-grid').innerHTML = '<div class="comp-status">Impossible de charger les compétitions pour le moment.</div>';
  });
})();
</script>
{{ end }}
